services:
  mailguard:
    build: .
    restart: unless-stopped
    init: true
    ports: ["${APP_PORT:-8080}:8080"]
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      DATA_DIR: /data
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: ["mailguard-data:/data"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  mailguard-data:
