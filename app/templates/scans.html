{% extends 'base.html' %}{% block content %}<div class="title"><div><h1>Scans & logs</h1><p class="muted">Every classification is recorded without storing full message bodies.</p></div></div><section class="card"><div class="table"><b>Scan</b><b>Started</b><b>Mode</b><b>Processed</b><b>Spam</b><b>Ham</b><b>Errors</b>{% for s in scans %}<a href="/scans/{{s.id}}">#{{s.id}}</a><span>{{s.started_at}}</span><span>{{s.mode}}</span><span>{{s.processed}}</span><span class="red">{{s.spam}}</span><span>{{s.ham}}</span><span>{{s.errors}}</span>{% endfor %}</div></section>{% endblock %}
